<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }
    #pdf-container {
      width: 100%;
      height: 100%;
      overflow-y: auto; /* Прокручування по вертикалі */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }
    canvas {
      display: block;
      margin-bottom: 20px; /* Відступ між сторінками */
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h1 style="text-align: center;">PDF Viewer</h1>
  <div id="pdf-container"></div>

  <script>
    var url = 'Menu.pdf';  // Замініть на правильне ім'я вашого PDF файлу
    var pdfjsLib = window['pdfjs-dist'];

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

    pdfjsLib.getDocument(url).promise.then(function (pdfDoc) {
      var numPages = pdfDoc.numPages;
      var pdfContainer = document.getElementById('pdf-container');

      // Функція для рендерингу сторінки
      function renderPage(pageNum) {
        pdfDoc.getPage(pageNum).then(function (page) {
          var canvas = document.createElement('canvas');
          var context = canvas.getContext('2d');

          // Масштабування під ширину екрану
          var scale = window.innerWidth / 600; // Масштабування під ширину екрана (600px - орієнтовна ширина сторінки PDF)
          var viewport = page.getViewport({ scale: scale });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          var renderContext = {
            canvasContext: context,
            viewport: viewport
          };

          page.render(renderContext).promise.then(function () {
            pdfContainer.appendChild(canvas); // Додаємо канвас на сторінку
          });
        });
      }

      // Перебираємо всі сторінки та додаємо їх в контейнер
      for (var pageNum = 1; pageNum <= numPages; pageNum++) {
        renderPage(pageNum);
      }
    }).catch(function (error) {
      console.error('Error loading PDF:', error);
    });
  </script>

</body>
</html>
