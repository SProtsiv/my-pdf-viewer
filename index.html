<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
        }
        #pdf-container {
            width: 100%;
            overflow-x: hidden;
        }
        canvas {
            display: block;
            margin: 10px auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="pdf-container"></div>
    <script>
        // URL до вашого PDF файлу
        var url = 'Menu.pdf';  // Замініть на правильне ім'я вашого PDF файлу

        // Ініціалізація PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';

        // Отримуємо PDF документ
        pdfjsLib.getDocument(url).promise.then(function(pdfDoc) {
            var numPages = pdfDoc.numPages;
            var pdfContainer = document.getElementById('pdf-container');

            // Функція для рендерингу сторінки
            function renderPage(pageNum) {
                pdfDoc.getPage(pageNum).then(function(page) {
                    var canvas = document.createElement('canvas');
                    var context = canvas.getContext('2d');
                    
                    // Отримуємо ширину вікна браузера
                    var scale = window.innerWidth / page.getViewport({ scale: 1 }).width; // Масштаб, щоб відповідати ширині екрану
                    var viewport = page.getViewport({ scale: scale });

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // Рендеримо сторінку на канвас
                    var renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    page.render(renderContext).promise.then(function() {
                        pdfContainer.appendChild(canvas); // Додаємо канвас на сторінку
                        
                        // Якщо це не остання сторінка, рендеримо наступну
                        if (pageNum < numPages) {
                            renderPage(pageNum + 1);
                        }
                    });
                });
            }

            // Починаємо з першої сторінки
            renderPage(1);

        }).catch(function(error) {
            console.error('Error loading PDF:', error);
        });
    </script>
</body>
</html>
