<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #pdf-viewer {
            width: 80%;
            display: flex;
            justify-content: center;
        }
        .page {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            width: 100%;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="pdf-viewer"></div>

    <script>
        const url = 'Menu.pdf'; // Вкажіть шлях до вашого PDF файлу

        // Завантажуємо PDF
        pdfjsLib.getDocument(url).promise.then(pdf => {
            const viewer = document.getElementById('pdf-viewer');
            let currentPage = 1;

            function renderPage(pageNum) {
                pdf.getPage(pageNum).then(page => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    const viewport = page.getViewport({ scale: 1.5 });

                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    page.render({ canvasContext: context, viewport: viewport }).promise.then(() => {
                        const pageDiv = document.createElement('div');
                        pageDiv.classList.add('page');
                        pageDiv.appendChild(canvas);
                        viewer.appendChild(pageDiv);
                    });
                });
            }

            function showNextPage() {
                if (currentPage <= pdf.numPages) {
                    renderPage(currentPage);
                    currentPage++;
                }
            }

            // Початкова демонстрація всіх сторінок по черзі
            setInterval(showNextPage, 1000); // Затримка в 1 секунду між сторінками
        }).catch(error => {
            console.error('Помилка завантаження PDF:', error);
        });
    </script>
</body>
</html>
